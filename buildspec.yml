version: 0.2

phases:
  install:
    commands:
      - echo "Ensuring scripts exist..."
      - ls -R .

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - ECR_REPO_URI=$(aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --query 'repositories[0].repositoryUri' --output text)
      - echo "ECR_REPO_URI=$ECR_REPO_URI"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin "$ECR_REPO_URI"

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image..."
      - docker build -t "$ECR_REPO_URI:latest" .

  post_build:
    commands:
      - ls -l
      - ls -l scripts || true
      - echo "Pushing Docker image..."
      - docker push "$ECR_REPO_URI:latest"
      - echo "Deploying ECS..."
      - aws ecs update-service --cluster te-ai-chatbot-dev --service te-ai-chatbot-dev --force-new-deployment
      - echo "Tagging commit..."
      - chmod +x scripts/tag_commit.sh
      - ./scripts/tag_commit.sh

