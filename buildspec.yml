version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ECR_REPO_NAME: te-ai-chatbot-dev
    ECS_CLUSTER_NAME: te-ai-chatbot-dev
    ECS_SERVICE_ARN: arn:aws:ecs:us-east-1:921868492248:service/te-ai-chatbot-dev/te-ai-chatbot-dev

phases:
  install:
    runtime-versions:
      docker: 24
    commands:
      - echo "Install phase..."

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ECR_REPO_URI=$(aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --query 'repositories[0].repositoryUri' --output text)
      - echo "ECR_REPO_URI=$ECR_REPO_URI"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin "$ECR_REPO_URI"

      # --- ВАЖНО: тянем секреты из SSM (те же, что в TF)
      - echo "Fetching secrets from SSM for build..."
      - export OPENAI_API_KEY=$(aws ssm get-parameter --name "/te-ai-chatbot/dev/OPENAI_API_KEY" --with-decryption --query 'Parameter.Value' --output text)
      - export NEXT_PUBLIC_SUPABASE_URL=$(aws ssm get-parameter --name "/te-ai-chatbot/dev/SUPABASE_URL" --with-decryption --query 'Parameter.Value' --output text)
      - export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(aws ssm get-parameter --name "/te-ai-chatbot/dev/SUPABASE_ANON_KEY" --with-decryption --query 'Parameter.Value' --output text)

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image..."
      - |
        docker build \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          --build-arg OPENAI_API_KEY="$OPENAI_API_KEY" \
          -t "$ECR_REPO_URI:latest" .

  post_build:
    commands:
      - echo "Pushing Docker image..."
      - docker push "$ECR_REPO_URI:latest"
      - echo "Updating ECS service..."
      - aws ecs update-service \
          --cluster "$ECS_CLUSTER_NAME" \
          --service "$ECS_SERVICE_ARN" \
          --force-new-deployment \
          --region "$AWS_DEFAULT_REGION"
      - echo "Done."

artifacts:
  files:
    - '**/*'

